<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Contatto</title>
</head>

<body>
  <header>
    <section id="nav-section">
      <img id="logo" src="../../assets/img/logo/Gemini_Generated_Image_64fccu64fccu64fc.png" alt="SportBook Milano">
      <h1>SportBook Milano</h1>
    </section>
    <section id="menu-navs">
      <nav>
        <h3>Vai alle pagine</h3>
        <ul>
          <li><a href="index.html">Homepage</a></li>
          <li><a href="profilo.html">Profilo</a></li>
          <li><a href="checkout.html">Checkout</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="contatto.html">Contatto</a></li>
          <li><a href="city.html">Città</a></li>
          <li><a href="preferences.html">Preferenze</a></li>
          <li><a href="next.html">Next</a></li>
        </ul>
      </nav>
      <nav>
        <h3>Naviga nella pagina</h3>
        <ul>
          <li><a href="#booking">Prenotazioni</a></li>
        </ul>
      </nav>
    </section>
  </header>
  <main>
    <section>
      <h2>Seleziona dove vuoi andare</h2>
      

      <form action="index.html">

        <fieldset>
          <legend for="service-citta">Scegli la città</legend>
          <select name="service-citta" id="service-citta" required>
            <optgroup label="Nord Italia">
              <option value="verona">Verona</option>
              <option value="venezia">Venezia</option>
              <option value="milano">Milano</option>
            </optgroup>
            <optgroup label="Centro Italia" disabled>
              <option value="milano">Roma</option>
            </optgroup>
            <optgroup label="Sud Italia">
              <option value="milano">Napoli</option>
              <option value="milano" selected>Palermo</option>
            </optgroup>
          </select>
        </fieldset>

        <fieldset>
          <legend>Dati personali</legend>
          <label for="name">Nome</label>
          <input type="text" id="name" name="name">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
        </fieldset>

        <fieldset>
          <legend>Indirizzo</legend>
          <label for="address">Via: </label>
          <input type="text" id="address" name="address" style="width: 100%">
        </fieldset>

        <fieldset>
          <legend>Azioni</legend>
          <input type="submit" value="Seleziona le preferenze">
          <input type="reset" value="Resetta le preferenze">
        </fieldset>

      </form>
    </section>
  </main>
  <footer>
    <article id="booking">
      <a href="mailto:info@sportbool.it">Scrivici</a>
      <a href="tel:112">Chiamaci</a>
      <small>&copy; 2026 SportBook Milano</small>
    </article>
  </footer>
</body>
</html>
