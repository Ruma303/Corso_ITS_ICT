<body>
  <header>
    <section id="nav-section">
      <img id="logo" src="../../assets/img/logo/Gemini_Generated_Image_64fccu64fccu64fc.png" alt="SportBook Milano">
      <h1>SportBook Milano</h1>
    </section>
    <section id="menu-navs">
      <nav>
        <h3>Vai alle pagine</h3>
        <ul>
          <li><a href="index.html">Homepage</a></li>
          <li><a href="profilo.html">Profilo</a></li>

        <ul>
          <li><a href="#booking">Prenotazioni</a></li>
        </ul>
      </nav>
    </section>
  </header>
  <main>
    <section>
      <h2>Contatto</h2>
      <form action="index.html">

        <article>
          <label for="name">Nome</label>
          <input type="text" id="name" required minlength="2">
        </article>

        <article>
          <label for="email">Email</label>
          <input type="email" id="name" required>
        </article>

        <article>
          <label for="service-select">Seleziona il servizio</label>
          <select name="service-select" id="service-select">
            <option value="1">Informazioni</option>
            <option value="2">Reclamo</option>
            <option value="3" selected>Preventivo</option>
          </select>
        </article>

        <article style="display: flex; flex-direction: column;">
          <label for="message">Messaggio</label>
          <textarea name="" id="message" cols="40" rows="5" required></textarea>
        </article>

        <article>
          <input type="submit" value="Accedi">
          <input type="reset" value="Resetta">
        </article>

      </form>
    </section>
  </main>
  <footer>
    <article id="booking">
      <a href="mailto:info@sportbool.it">Scrivici</a>
      <a href="tel:112">Chiamaci</a>
      <small>&copy; 2026 SportBook Milano</small>
    </article>
  </footer>
