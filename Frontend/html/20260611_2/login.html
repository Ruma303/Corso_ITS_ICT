<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>

<body>
  <header>
    <section id="nav-section">
      <img id="logo" src="../../assets/img/logo/Gemini_Generated_Image_64fccu64fccu64fc.png" alt="SportBook Milano">
      <h1>SportBook Milano</h1>
    </section>
    <section id="menu-navs">
      <nav>
        <h3>Vai alle pagine</h3>
        <ul>
          <li><a href="index.html">Homepage</a></li>
          <li><a href="profilo.html">Profilo</a></li>
          <li><a href="checkout.html">Checkout</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="contatto.html">Contatto</a></li>
          <li><a href="city.html">Città</a></li>
          <li><a href="preferences.html">Preferenze</a></li>        </ul>
      </nav>
      <nav>
        <h3>Naviga nella pagina</h3>
        <ul>
          <li><a href="#booking">Prenotazioni</a></li>
        </ul>
      </nav>
    </section>
  </header>
  <main>
    <section>
      <h2>Login</h2>
      <form action="profilo.html">

        <article>
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </article>

        <article>
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </article>

        <article>
          <label>
            <input type="checkbox" name="rememberme" id="rememberme">
            Ricordami
          </label>
        </article>

        <article>
          <h4>Tipologia account</h4>
          <label>
            <input type="radio" name="account-type" id="account-type" checked>
            Personale
          </label>
          <label>
            <input type="radio" name="account-type" id="account-type">
            Aziendale
          </label>
        </article>

        <article>
          <label for="language-select">Seleziona la lingua</label>
          <select name="language-select" id="language-select">
            <option value="IT">Italiano</option>
            <option value="EN" selected>Inglese</option>
            <option value="ES" disabled>Spagnolo</option>
          </select>
        </article>

        <article>
          <input type="hidden" name="app_id" value="sportbook-2026">
        </article>

        <article>
          <input type="submit" value="Accedi">
          <input type="reset" value="Resetta">
        </article>

      </form>
    </section>
  </main>
  <footer>
    <article id="booking">
      <a href="mailto:info@sportbool.it">Scrivici</a>
      <a href="tel:112">Chiamaci</a>
      <small>&copy; 2026 SportBook Milano</small>
    </article>
  </footer>
</body>

</html>
