<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripasso HTML</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <h2>Form di ricerca</h2>
    <form action="#" method="POST" id="form">
      <label for="nameInput">Nome:</label>
      <input type="text" id="nameInput" name="nome" placeholder="Inserisci il tuo nome qui ..." maxlength="20">

      <label for="cognomeInput">Cognome:</label>
      <input type="text" id="cognomeInput" name="cognome" placeholder="Inserisci il tuo cognome qui..." maxlength="30">

      <label for="ageInput">Età:</label>
      <input type="number" id="ageInput" name="eta" placeholder="Inserisci la tua età tra 18 e 100" min="18" max="100">

      <fieldset>
        <legend>Sesso:</legend>
        <div id="radios">
          <div class="genderRadios">
            <label for="genderInputM">Maschio:</label>
            <input type="radio" id="genderInputM" name="sesso" value="male">
          </div>
          <div class="genderRadios">
            <label for="genderInputF">Femmina:</label>
            <input type="radio" id="genderInputF" name="sesso" value="female">
          </div>
        </div>
      </fieldset>

      <div id="buttons">
        <button type="submit">Invia</button>
        <button type="reset">Reset</button>
      </div>
    </form>

    <!-- Risultati nascosti -->
    <section id="result-section" class="hidden">
      <h2>Risultati</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
            <th>Sesso</th>
            <th>Numero telefono</th>
          </tr>
        </thead>
        <tbody id="tbody-result"></tbody>
      </table>
    </section>

  </main>
  <script src="./script.js"></script>
</body>

</html>
