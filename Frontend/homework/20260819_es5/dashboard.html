<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Corso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #f4f6f9;
    }
    header {
      background-color: #2a2929;
      padding: 1.5em;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 0.5rem;
    }
    header h1 {
      color: white;
      margin: 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dashboard Corso</h1>
    <nav>
      <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <div class="table-responsive bg-white p-3 rounded shadow-sm">
          <table class="table table-bordered table-striped text-center mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col">Nome Corso</th>
                <th scope="col">Docente</th>
                <th scope="col">Anno</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Sviluppo Web Full Stack</td>
                <td>Prof. Rossi</td>
                <td>2026</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <footer class="py-3">
    <p class="text-center text-muted m-0">&copy; 2026 Matteo Emanuele Russo</p>
  </footer>

  <script>
    const studenti = [
      { nome: "Ugo", voto: 26, assenze: 3 },
      { nome: "Mario", voto: 28, assenze: 5 },
      { nome: "Alfonso", voto: 16, assenze: 2 }
    ];
    studenti.push({ nome: "Andrea", voto: 25, assenze: 6 });

    for (const studente of studenti) {
      if (studente.voto >= 18 && studente.assenze < 5) {
        console.log(`${studente.nome} - Voto: ${studente.voto} | Assenze: ${studente.assenze} -> Promosso!`);
      } else {
        console.log(`${studente.nome} - Voto: ${studente.voto} | Assenze: ${studente.assenze} -> Non promosso.`);
      }
    }
    console.log(`Totale studenti analizzati: ${studenti.length}`);
  </script>

</body>

</html>
