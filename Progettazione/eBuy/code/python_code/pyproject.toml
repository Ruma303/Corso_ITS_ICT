[project]
name = "python-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruma303", email = "matteoh8@hotmail.it" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.1",
