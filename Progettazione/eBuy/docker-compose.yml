services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ebuy
      POSTGRES_PASSWORD: ebuy
      POSTGRES_DB: ebuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema + seed, eseguiti solo al primo avvio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebuy"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ebuy.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"            # niente login in locale
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8081:80"
    volumes:
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: